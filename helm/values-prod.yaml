# Cloud / production overrides. Use with:
#   helm install dclaw-finance ./helm -n <ns> -f values-prod.yaml
image:
  backend:
    repository: ghcr.io/dclawstack/dclaw-finance-backend
    tag: latest
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/dclawstack/dclaw-finance-frontend
    tag: latest
    pullPolicy: IfNotPresent
service:
  frontend:
    type: ClusterIP
    port: 3007
ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  host: finance.dclawstack.io
  tls:
    - secretName: dclaw-finance-tls
      hosts:
        - finance.dclawstack.io
