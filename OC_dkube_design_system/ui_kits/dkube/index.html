<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DKube — UI Kit</title>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Primitives.jsx"></script>
<script type="text/babel" src="TopBar.jsx"></script>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="DashboardScreen.jsx"></script>
<script type="text/babel" src="PipelineScreen.jsx"></script>
<script type="text/babel" src="ModelsScreen.jsx"></script>
<script type="text/babel" src="NotebookScreen.jsx"></script>

<script type="text/babel">
function App() {
  const [route, setRoute] = React.useState('dashboard');
  const [pipelineName, setPipelineName] = React.useState('resnet-finetune');

  const handleNavigate = (id) => setRoute(id);
  const openPipeline = (name) => { setPipelineName(name); setRoute('pipelines-detail'); };
  const goBack = () => setRoute('dashboard');

  let screen;
  switch (route) {
    case 'pipelines':
    case 'pipelines-detail':
      screen = <PipelineScreen name={pipelineName} onBack={goBack} />;
      break;
    case 'models':
      screen = <ModelsScreen />;
      break;
    case 'notebooks':
      screen = <NotebookScreen />;
      break;
    case 'dashboard':
    default:
      screen = <DashboardScreen onOpenPipeline={openPipeline} />;
  }

  const sidebarActive = route === 'pipelines-detail' ? 'pipelines' : route;

  return (
    <div data-screen-label={`DKube · ${route}`}>
      <TopBar />
      <div style={{ display: 'flex', minHeight: 'calc(100vh - 60px)' }}>
        <Sidebar active={sidebarActive} onNavigate={handleNavigate} />
        {screen}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
