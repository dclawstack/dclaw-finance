<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:0; width:700px;">
<div style="display:grid; grid-template-columns: 1fr 1fr; border:1px solid var(--ink);">
  <div style="padding:32px 28px; min-height:200px; display:flex; flex-direction:column; justify-content:space-between; border-right:1px solid var(--ink); background:white;">
    <div style="font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:#5A5A5A;">DKube · primary</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <img src="../assets/dkube-mark-official.avif" alt="DKube" style="height: 56px; width: auto;">
      <div style="font-family:var(--serif); font-weight:700; font-size:28px; letter-spacing:-0.035em; color:#6E55A4;">DKube<sup style="font-size:10px; vertical-align:top; margin-left:2px; font-weight:600;">TM</sup></div>
    </div>
    <div style="font-family:var(--mono); font-size:10px; text-transform:uppercase; color:#8A8A8A; letter-spacing:0.04em;">Flagship product mark</div>
  </div>
  <div style="padding:32px 28px; min-height:200px; display:flex; flex-direction:column; justify-content:space-between; background:#141414; color:white;">
    <div style="font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:rgba(255,255,255,0.7);">Reversed</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <img src="../assets/dkube-mark-official.avif" alt="DKube" style="height: 56px; width: auto; filter: brightness(0) invert(1);">
      <div style="font-family:var(--serif); font-weight:700; font-size:28px; letter-spacing:-0.035em; color:white;">DKube<sup style="font-size:10px; vertical-align:top; margin-left:2px; font-weight:600; color:rgba(255,255,255,0.7);">TM</sup></div>
    </div>
    <div style="font-family:var(--mono); font-size:10px; text-transform:uppercase; color:rgba(255,255,255,0.55); letter-spacing:0.04em;">Dark surface variant</div>
  </div>
</div>
</body></html>
