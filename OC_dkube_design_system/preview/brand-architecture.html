<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:0; width:700px;">
<div style="display:grid; grid-template-columns: 1fr 1fr; border:1px solid var(--ink); min-height:200px;">
  <div style="padding:28px 24px; display:flex; flex-direction:column; justify-content:space-between; border-right:1px solid var(--ink); background:#7030A0; color:white;">
    <div style="font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.06em; opacity:0.8;">One Convergence — Parent</div>
    <div>
      <div style="font-family:var(--serif); font-size:36px; letter-spacing:-0.025em; line-height:1; font-weight:400;">The company.</div>
      <div style="font-family:var(--sans); font-size:13px; line-height:1.5; margin-top:10px; opacity:0.85;">Corporate site · contracts · investor materials · platform-wide announcements.</div>
    </div>
  </div>
  <div style="padding:28px 24px; display:flex; flex-direction:column; justify-content:space-between; background:#141414; color:white;">
    <div style="font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:rgba(255,255,255,0.6);">DKube — Product</div>
    <div>
      <div style="font-family:var(--serif); font-size:36px; letter-spacing:-0.025em; line-height:1; font-weight:400;">The platform.</div>
      <div style="font-family:var(--sans); font-size:13px; line-height:1.5; margin-top:10px; color:rgba(255,255,255,0.7);">Product UI · docs · SDK · developer marketing · technical white papers.</div>
    </div>
  </div>
</div>
</body></html>
