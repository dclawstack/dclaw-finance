<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:0; width:700px; border:1px solid var(--ink);">
<div style="display:grid; grid-template-columns: 1fr 1fr; min-height:240px;">
  <div style="background:white; padding:24px; display:flex; align-items:center; justify-content:center; border-right:1px solid var(--ink);">
    <div style="font-family:var(--serif); font-size:200px; line-height:0.85; letter-spacing:-0.04em; font-variation-settings:'opsz' 144;">A<em style="color:#7030A0; font-style:italic;">a</em></div>
  </div>
  <div style="padding:24px; display:flex; flex-direction:column; justify-content:space-between;">
    <div>
      <div style="font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:#5A5A5A; margin-bottom:8px;">Display family</div>
      <div style="font-family:var(--serif); font-size:36px; letter-spacing:-0.02em; line-height:1;">Fraunces</div>
      <div style="font-family:var(--sans); font-size:12px; color:#5A5A5A; margin-top:8px; line-height:1.5;">Soft-serif display. Optical sizes 9→144. Reserved for hero, section openers, and editorial pull-quotes.</div>
    </div>
    <div style="font-family:var(--mono); font-size:11px; line-height:1.7; color:#5A5A5A;">
      <div><span style="color:#141414;">400 / 500 / 600</span> &nbsp;weights in use</div>
      <div>SIL OFL · Google Fonts</div>
    </div>
  </div>
</div>
</body></html>
