<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:0; width:700px; border:1px solid var(--ink);">
<div style="display:grid; grid-template-columns: 1fr 1fr; min-height:220px;">
  <div style="padding:24px; border-right:1px solid var(--ink);">
    <div style="font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:#5A5A5A; margin-bottom:14px;">Inter — UI &amp; body</div>
    <div style="font-family:var(--sans); font-size:72px; line-height:0.9; letter-spacing:-0.04em; font-weight:600; color:#141414;">Aa</div>
    <div style="font-family:var(--mono); font-size:11px; line-height:1.7; color:#5A5A5A; margin-top:16px;">
      <div><span style="color:#141414;">400 / 500 / 600 / 700</span></div>
      <div>Sentence case · −0.5% tracking on heads</div>
    </div>
  </div>
  <div style="padding:24px; background:#141414; color:white;">
    <div style="font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:rgba(255,255,255,0.65); margin-bottom:14px;">JetBrains Mono — code</div>
    <div style="font-family:var(--mono); font-size:48px; line-height:1; letter-spacing:0.02em; font-weight:500; color:#B180F8;">{ }</div>
    <div style="font-family:var(--mono); font-size:11px; line-height:1.7; color:rgba(255,255,255,0.7); margin-top:16px;">
      <div style="color:white;">400 / 500</div>
      <div>Also used for eyebrows, metadata, captions</div>
    </div>
  </div>
</div>
</body></html>
