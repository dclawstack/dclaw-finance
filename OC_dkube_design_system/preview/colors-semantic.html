<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:0; width:700px;">
<div style="display:grid; grid-template-columns: repeat(4, 1fr); border:1px solid var(--ink);">
  <div style="background:#18A957; color:white; padding:18px; min-height:160px; display:flex; flex-direction:column; justify-content:space-between; border-right:1px solid var(--ink);">
    <div style="font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.06em; opacity:0.85;">Success</div>
    <div>
      <div style="font-family:var(--serif); font-size:18px;">Passed</div>
      <div style="font-family:var(--mono); font-size:10px; line-height:1.6; opacity:0.9; margin-top:6px;">#18A957</div>
    </div>
  </div>
  <div style="background:#C2870B; color:white; padding:18px; min-height:160px; display:flex; flex-direction:column; justify-content:space-between; border-right:1px solid var(--ink);">
    <div style="font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.06em; opacity:0.85;">Warning</div>
    <div>
      <div style="font-family:var(--serif); font-size:18px;">At quota</div>
      <div style="font-family:var(--mono); font-size:10px; line-height:1.6; opacity:0.9; margin-top:6px;">#C2870B</div>
    </div>
  </div>
  <div style="background:#C2240C; color:white; padding:18px; min-height:160px; display:flex; flex-direction:column; justify-content:space-between; border-right:1px solid var(--ink);">
    <div style="font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.06em; opacity:0.85;">Error</div>
    <div>
      <div style="font-family:var(--serif); font-size:18px;">Failed</div>
      <div style="font-family:var(--mono); font-size:10px; line-height:1.6; opacity:0.9; margin-top:6px;">#C2240C</div>
    </div>
  </div>
  <div style="background:#1F3FBF; color:white; padding:18px; min-height:160px; display:flex; flex-direction:column; justify-content:space-between;">
    <div style="font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.06em; opacity:0.85;">Info</div>
    <div>
      <div style="font-family:var(--serif); font-size:18px;">New release</div>
      <div style="font-family:var(--mono); font-size:10px; line-height:1.6; opacity:0.9; margin-top:6px;">#1F3FBF</div>
    </div>
  </div>
</div>
</body></html>
