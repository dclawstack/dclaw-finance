<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:0; width:700px;">
<div style="display:grid; grid-template-columns: repeat(3, 1fr); border:1px solid var(--ink);">
  <div style="background:#1F3FBF; color:white; padding:18px; min-height:160px; display:flex; flex-direction:column; justify-content:space-between; border-right:1px solid var(--ink);">
    <div style="font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.06em; opacity:0.85;">Cobalt</div>
    <div>
      <div style="font-family:var(--serif); font-size:18px;">Editorial accent</div>
      <div style="font-family:var(--mono); font-size:10px; line-height:1.6; opacity:0.9; margin-top:6px;">#1F3FBF<br>31 · 63 · 191</div>
    </div>
  </div>
  <div style="background:#C2410C; color:white; padding:18px; min-height:160px; display:flex; flex-direction:column; justify-content:space-between; border-right:1px solid var(--ink);">
    <div style="font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.06em; opacity:0.85;">Ember</div>
    <div>
      <div style="font-family:var(--serif); font-size:18px;">Pull-quote</div>
      <div style="font-family:var(--mono); font-size:10px; line-height:1.6; opacity:0.9; margin-top:6px;">#C2410C<br>194 · 65 · 12</div>
    </div>
  </div>
  <div style="background:#FAF8F4; color:#141414; padding:18px; min-height:160px; display:flex; flex-direction:column; justify-content:space-between;">
    <div style="font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:#5A5A5A;">Warm Paper</div>
    <div>
      <div style="font-family:var(--serif); font-size:18px;">Editorial ground</div>
      <div style="font-family:var(--mono); font-size:10px; line-height:1.6; color:#5A5A5A; margin-top:6px;">#FAF8F4<br>250 · 248 · 244</div>
    </div>
  </div>
</div>
</body></html>
