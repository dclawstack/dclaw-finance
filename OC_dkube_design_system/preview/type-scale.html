<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:0; width:700px; border:1px solid var(--ink);">
<div style="padding:20px 24px;">
  <div style="display:grid; grid-template-columns: 100px 1fr 110px; align-items:baseline; padding:8px 0; border-bottom:1px solid var(--rule);">
    <span style="font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:#5A5A5A;">Display</span>
    <span style="font-family:var(--serif); font-size:40px; letter-spacing:-0.03em; line-height:1; font-weight:400;">Converge.</span>
    <span style="font-family:var(--mono); font-size:10px; color:#5A5A5A; text-align:right;">72 / 72</span>
  </div>
  <div style="display:grid; grid-template-columns: 100px 1fr 110px; align-items:baseline; padding:8px 0; border-bottom:1px solid var(--rule);">
    <span style="font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:#5A5A5A;">H1</span>
    <span style="font-family:var(--serif); font-size:28px; letter-spacing:-0.025em; line-height:1.05; font-weight:400;">Built for ML engineers.</span>
    <span style="font-family:var(--mono); font-size:10px; color:#5A5A5A; text-align:right;">48 / 50</span>
  </div>
  <div style="display:grid; grid-template-columns: 100px 1fr 110px; align-items:baseline; padding:8px 0; border-bottom:1px solid var(--rule);">
    <span style="font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:#5A5A5A;">H2</span>
    <span style="font-family:var(--serif); font-size:22px; letter-spacing:-0.02em; line-height:1.1; font-weight:500;">A platform, not a checklist.</span>
    <span style="font-family:var(--mono); font-size:10px; color:#5A5A5A; text-align:right;">36 / 40</span>
  </div>
  <div style="display:grid; grid-template-columns: 100px 1fr 110px; align-items:baseline; padding:8px 0; border-bottom:1px solid var(--rule);">
    <span style="font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:#5A5A5A;">H3</span>
    <span style="font-family:var(--sans); font-size:17px; letter-spacing:-0.015em; line-height:1.25; font-weight:600;">Training jobs & serving</span>
    <span style="font-family:var(--mono); font-size:10px; color:#5A5A5A; text-align:right;">24 / 30</span>
  </div>
  <div style="display:grid; grid-template-columns: 100px 1fr 110px; align-items:baseline; padding:8px 0; border-bottom:1px solid var(--rule);">
    <span style="font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:#5A5A5A;">Body</span>
    <span style="font-family:var(--sans); font-size:14px; line-height:1.5; font-weight:400;">DKube manages the full MLOps lifecycle.</span>
    <span style="font-family:var(--mono); font-size:10px; color:#5A5A5A; text-align:right;">15 / 24</span>
  </div>
  <div style="display:grid; grid-template-columns: 100px 1fr 110px; align-items:baseline; padding:8px 0;">
    <span style="font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:#5A5A5A;">Mono</span>
    <span style="font-family:var(--mono); font-size:12px; line-height:1.6;">kubectl apply -f dkube.yaml</span>
    <span style="font-family:var(--mono); font-size:10px; color:#5A5A5A; text-align:right;">13 / 21</span>
  </div>
</div>
</body></html>
