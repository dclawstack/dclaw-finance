<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .badge { display:inline-flex; align-items:center; gap:5px; padding:3px 9px; font-family:var(--sans); font-size:11px; font-weight:600; letter-spacing:0.02em; border-radius:2px; border:1px solid transparent; text-transform:uppercase; line-height:1.4; }
  .badge::before { content:""; width:6px; height:6px; background:currentColor; display:inline-block; }
  .b1 { background:#F5EEFB; color:#2B0E45; }
  .b2 { background:#F6F5F7; color:#2A2A2A; }
  .b3 { background:#ECF8F0; color:#156B3A; }
  .b4 { background:#FBF3DE; color:#7A5300; }
  .b5 { background:#FBEAE6; color:#8B1D0C; }
  .b6 { background:transparent; color:#141414; border-color:#141414; }
</style></head>
<body style="padding:20px; width:700px;">
<div style="border:1px solid var(--ink); padding:24px;">
  <div style="font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:#5A5A5A; margin-bottom:16px;">Badges · 6 variants</div>
  <div style="display:flex; gap:8px; flex-wrap:wrap;">
    <span class="badge b1">Brand</span>
    <span class="badge b2">Neutral</span>
    <span class="badge b3">Healthy</span>
    <span class="badge b4">At quota</span>
    <span class="badge b5">Failed</span>
    <span class="badge b6">Beta</span>
  </div>
  <div style="font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.04em; color:#5A5A5A; margin-top:18px;">Always paired with a label. Color is the third signal.</div>
</div>
</body></html>
