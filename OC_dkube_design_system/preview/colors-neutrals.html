<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:0; width:700px;">
<div style="display:grid; grid-template-columns: repeat(5, 1fr); border:1px solid var(--ink);">
  <div style="background:#141414; color:white; padding:16px; min-height:160px; display:flex; flex-direction:column; justify-content:space-between; border-right:1px solid var(--ink);">
    <div style="font-family:var(--mono); font-size:9px; text-transform:uppercase; letter-spacing:0.06em; opacity:0.75;">Ink 900</div>
    <div>
      <div style="font-family:var(--serif); font-size:16px;">Ink</div>
      <div style="font-family:var(--mono); font-size:9px; line-height:1.6; opacity:0.85; margin-top:4px;">#141414</div>
    </div>
  </div>
  <div style="background:#2A2A2A; color:white; padding:16px; min-height:160px; display:flex; flex-direction:column; justify-content:space-between; border-right:1px solid var(--ink);">
    <div style="font-family:var(--mono); font-size:9px; text-transform:uppercase; letter-spacing:0.06em; opacity:0.75;">Graphite 700</div>
    <div>
      <div style="font-family:var(--serif); font-size:16px;">Graphite</div>
      <div style="font-family:var(--mono); font-size:9px; line-height:1.6; opacity:0.85; margin-top:4px;">#2A2A2A</div>
    </div>
  </div>
  <div style="background:#5A5A5A; color:white; padding:16px; min-height:160px; display:flex; flex-direction:column; justify-content:space-between; border-right:1px solid var(--ink);">
    <div style="font-family:var(--mono); font-size:9px; text-transform:uppercase; letter-spacing:0.06em; opacity:0.75;">Slate 500</div>
    <div>
      <div style="font-family:var(--serif); font-size:16px;">Slate</div>
      <div style="font-family:var(--mono); font-size:9px; line-height:1.6; opacity:0.85; margin-top:4px;">#5A5A5A</div>
    </div>
  </div>
  <div style="background:#F6F5F7; color:#141414; padding:16px; min-height:160px; display:flex; flex-direction:column; justify-content:space-between; border-right:1px solid var(--ink);">
    <div style="font-family:var(--mono); font-size:9px; text-transform:uppercase; letter-spacing:0.06em; color:#5A5A5A;">Mist 100</div>
    <div>
      <div style="font-family:var(--serif); font-size:16px;">Mist</div>
      <div style="font-family:var(--mono); font-size:9px; line-height:1.6; margin-top:4px;">#F6F5F7</div>
    </div>
  </div>
  <div style="background:#FFFFFF; color:#141414; padding:16px; min-height:160px; display:flex; flex-direction:column; justify-content:space-between;">
    <div style="font-family:var(--mono); font-size:9px; text-transform:uppercase; letter-spacing:0.06em; color:#5A5A5A;">Paper 000</div>
    <div>
      <div style="font-family:var(--serif); font-size:16px;">Paper</div>
      <div style="font-family:var(--mono); font-size:9px; line-height:1.6; margin-top:4px;">#FFFFFF</div>
    </div>
  </div>
</div>
</body></html>
