<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:0; width:700px;">
<div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:0; border:1px solid var(--ink);">
  <div style="background:#4A1F6C; color:white; padding:18px; min-height:160px; display:flex; flex-direction:column; justify-content:space-between; border-right:1px solid var(--ink);">
    <div style="font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.06em; opacity:0.75;">OC · Purple 700</div>
    <div>
      <div style="font-family:var(--serif); font-size:20px; letter-spacing:-0.02em;">Purple Dark</div>
      <div style="font-family:var(--mono); font-size:10px; line-height:1.6; opacity:0.85; margin-top:6px;">#4A1F6C<br>74 · 31 · 108</div>
    </div>
  </div>
  <div style="background:#7030A0; color:white; padding:18px; min-height:160px; display:flex; flex-direction:column; justify-content:space-between; border-right:1px solid var(--ink); position:relative;">
    <div style="display:flex; justify-content:space-between; font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.06em;">
      <span style="opacity:0.85;">OC · Purple 500</span>
      <span style="background:white; color:#7030A0; padding:1px 6px;">PRIMARY</span>
    </div>
    <div>
      <div style="font-family:var(--serif); font-size:20px; letter-spacing:-0.02em;">Signature Purple</div>
      <div style="font-family:var(--mono); font-size:10px; line-height:1.6; opacity:0.9; margin-top:6px;">#7030A0<br>112 · 48 · 160<br>Pantone 2603 C</div>
    </div>
  </div>
  <div style="background:#B180F8; color:#141414; padding:18px; min-height:160px; display:flex; flex-direction:column; justify-content:space-between;">
    <div style="font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:rgba(20,20,20,0.7);">OC · Purple 300</div>
    <div>
      <div style="font-family:var(--serif); font-size:20px; letter-spacing:-0.02em;">Purple Light</div>
      <div style="font-family:var(--mono); font-size:10px; line-height:1.6; margin-top:6px;">#B180F8<br>177 · 128 · 248</div>
    </div>
  </div>
</div>
</body></html>
